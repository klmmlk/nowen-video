name: Android TV (android-tv-av1)

# 专门编译 feature/android-tv-av1 分支的 TV 版 APK。
# 与 android.yml（主分支质量门）并行运行；不重复 lint / unit test，
# 只验证本分支的 TV 风味 debug + release 都能产出可装 APK。
on:
  push:
    branches:
      - feature/android-tv-av1
    paths:
      - 'android/**'
      - 'scripts/build-media3-decoder-av1.sh'
      - 'scripts/media3-decoder-av1-patches/**'
      - '.github/workflows/android-tv-av1.yml'
  pull_request:
    branches:
      - feature/android-tv-av1
    paths:
      - 'android/**'
      - 'scripts/build-media3-decoder-av1.sh'
      - 'scripts/media3-decoder-av1-patches/**'
      - '.github/workflows/android-tv-av1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tv-av1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        env:
          SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -euo pipefail
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          # Pre-accept licenses by writing the accepted hash files directly,
          # avoiding `yes | sdkmanager --licenses` (broken pipe under pipefail).
          mkdir -p "$SDK_ROOT/licenses"
          printf '%s\n' '24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$SDK_ROOT/licenses/android-sdk-license"
          printf '%s\n' '84831b9409646a918e30573bab4c9c91346d8abd' > "$SDK_ROOT/licenses/android-sdk-preview-license"
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-28" \
            "build-tools;35.0.0" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-tv-av1-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-tv-av1-${{ runner.os }}-

      - name: Build AV1 soft-decoder aar
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -euo pipefail
          # env does not expand $PATH in GitHub Actions; prepend sdk tools inside
          # the shell instead so system commands stay on PATH.
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          chmod +x scripts/build-media3-decoder-av1.sh
          mkdir -p android/feature/tv/libs
          bash scripts/build-media3-decoder-av1.sh \
            android/feature/tv/libs \
            "$ANDROID_HOME" \
            25.1.8937393
          ls -la android/feature/tv/libs/media3-decoder-av1-1.5.1.aar

      - name: Write android/local.properties
        run: |
          printf 'sdk.dir=%s\n' "${{ github.workspace }}/android-sdk" \
            > android/local.properties

      - name: Generate debug keystore for release fallback signing
        run: |
          set -euo pipefail
          # CI runner 没有 ~/.android/debug.keystore；release 的 debugFallback
          # signingConfig 指向它，不生成则 packageTvRelease 签名阶段报错。
          # 参数与 Android Studio / AGP 自动生成的 debug keystore 保持一致。
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build TV debug APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleTvDebug --no-daemon --console=plain 2>&1 | tee tv-debug.log

      - name: Build TV release APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleTvRelease --no-daemon --console=plain 2>&1 | tee tv-release.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-av1-logs
          path: |
            android/tv-debug.log
            android/tv-release.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload TV debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-av1-debug
          path: android/app/build/outputs/apk/tv/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload TV release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-av1-release
          path: android/app/build/outputs/apk/tv/release/*.apk
          if-no-files-found: error
          retention-days: 14
